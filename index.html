<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>魚眼フォト</title>
<style>
body{margin:0;background:#111;color:white;font-family:sans-serif;text-align:center}
h2{margin:15px}
#canvas{width:95%;max-width:700px;border-radius:12px;touch-action:none}
.panel{padding:15px}
button,label{display:inline-block;padding:12px 16px;margin:5px;border:0;border-radius:10px;background:#287cff;color:white;font-weight:bold}
input[type=file]{display:none}
input[type=range]{width:65%}
</style>
</head>
<body>
<h2>🐟 魚眼フォト</h2>

<label for="file">📷 写真を選ぶ</label>
<input id="file" type="file" accept="image/*">

<canvas id="canvas"></canvas>

<div class="panel">
<p>強さ：<input id="strength" type="range" min="0" max="1" step=".01" value=".65"></p>
<p>範囲：<input id="radius" type="range" min=".1" max=".8" step=".01" value=".3"></p>
<p>写真をタップすると、そこが魚眼になります。</p>
<button onclick="reset()">リセット</button>
<button onclick="save()">画像を保存</button>
</div>

<script>
const file=document.getElementById("file");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
let img=new Image(),base=null;
let px=.5,py=.5;

file.onchange=e=>{
 const f=e.target.files[0];
 if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  img.onload=()=>{
   const scale=Math.min(1,1800/Math.max(img.width,img.height));
   canvas.width=img.width*scale;
   canvas.height=img.height*scale;
   base=document.createElement("canvas");
   base.width=canvas.width;
   base.height=canvas.height;
   base.getContext("2d").drawImage(img,0,0,base.width,base.height);
   draw();
  };
  img.src=r.result;
 };
 r.readAsDataURL(f);
};

canvas.addEventListener("pointerdown",e=>{
 const r=canvas.getBoundingClientRect();
 px=(e.clientX-r.left)/r.width;
 py=(e.clientY-r.top)/r.height;
 draw();
});

document.getElementById("strength").oninput=draw;
document.getElementById("radius").oninput=draw;

function draw(){
 if(!base)return;

 const w=canvas.width,h=canvas.height;
 const src=base.getContext("2d").getImageData(0,0,w,h);
 const out=ctx.createImageData(w,h);
 const s=+strength.value;
 const rad=+radius.value*Math.min(w,h);
 const cx=px*w,cy=py*h;

 for(let y=0;y<h;y++){
  for(let x=0;x<w;x++){
   let dx=x-cx,dy=y-cy;
   let d=Math.sqrt(dx*dx+dy*dy);
   let sx=x,sy=y;

   if(d<rad){
    let q=d/rad;
    let k=1+s*(1-q*q);
    sx=cx+dx/k;
    sy=cy+dy/k;
   }

   sx=Math.max(0,Math.min(w-1,Math.floor(sx)));
   sy=Math.max(0,Math.min(h-1,Math.floor(sy)));

   let a=(sy*w+sx)*4;
   let b=(y*w+x)*4;

   out.data[b]=src.data[a];
   out.data[b+1]=src.data[a+1];
   out.data[b+2]=src.data[a+2];
   out.data[b+3]=255;
  }
 }
 ctx.putImageData(out,0,0);
}

function reset(){
 px=.5;py=.5;
 strength.value=.65;
 radius.value=.3;
 draw();
}

function save(){
 if(!base)return alert("先に写真を選んでください");
 const a=document.createElement("a");
 a.download="fisheye-photo.png";
 a.href=canvas.toDataURL("image/png");
 a.click();
}
</script>
</body>
</html>
